
name: dreamerv3-prey
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - jax==0.4.20
      - jaxlib==0.4.20
      - optax==0.1.7
      - tensorflow==2.15.0          
      - tensorflow-probability==0.23.0
      - numpy==1.26.4               
      - scipy==1.11.4                
      - cloudpickle
      - ruamel.yaml
      - rich
      - zmq
      - msgpack
      - gym==0.26.2                 
      - gymnasium==0.28.1            
      - cellworld==0.0.381
      - matplotlib
      - shapely>=2.0                # agent bodies, collision, line of sight (prey_env/geometry.py)
      - pygame>=2.6                 # offscreen Mice-look frames for the videos (prey_env/render.py)
      - moviepy==1.0.3              # episode MP4 videos (prey_env/video.py), same as the Mice env
      - requests
